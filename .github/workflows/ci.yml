name: CI - Testes e Validação Terraform

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 3. Instalar dependências
        run: npm ci

      - name: 4. Rodar testes (validação de CPF)
        run: npm test

  terraform-plan:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: infra
    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: 3. Autenticar no Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 4. terraform init
        run: terraform init

      - name: 5. terraform validate
        run: terraform validate

      - name: 6. terraform plan (só leitura, não aplica)
        run: terraform plan
        env:
          TF_VAR_db_admin_password: ${{ secrets.DB_ADMIN_PASSWORD }}
          TF_VAR_jwt_private_key_pem: ${{ secrets.JWT_PRIVATE_KEY_PEM }}

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 3. Instalar dependências (produção)
        run: npm ci

      - name: 4. Autenticar no Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 5. Publicar o código no Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: oficina-lambda-auth-cpf
          package: '.'

  # terraform apply continua manual nesta fase — mesma convenção dos outros
  # 3 repositórios deste projeto: infraestrutura provisionada via Terraform
  # nunca é aplicada automaticamente em CI, só validada com `terraform
  # plan`. Já o CÓDIGO da Function (job "deploy" acima) publica
  # automaticamente a cada push na main, igual o repositório oficina-app.
